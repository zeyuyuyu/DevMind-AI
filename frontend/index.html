<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevMind AI - Your Coding Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
</head>
<body class="bg-gray-900 text-white">
    <div id="app" class="min-h-screen">
        <!-- Floating AI Assistant Avatar -->
        <div class="fixed bottom-4 right-4 animate__animated animate__bounceIn">
            <div class="relative">
                <img src="https://api.dicebear.com/6.x/bottts/svg?seed=DevMind" class="w-16 h-16 rounded-full border-2 border-purple-500 cursor-pointer hover:scale-110 transition-transform" @click="toggleAIChat">
                <div class="absolute -top-2 -right-2 bg-green-500 w-4 h-4 rounded-full animate-pulse"></div>
            </div>
        </div>

        <!-- AI Chat Interface -->
        <div id="ai-chat" class="fixed bottom-24 right-4 w-80 bg-gray-800 rounded-lg shadow-xl p-4 hidden">
            <div class="flex items-center mb-4">
                <img src="https://api.dicebear.com/6.x/bottts/svg?seed=DevMind" class="w-8 h-8 rounded-full mr-2">
                <div>
                    <h3 class="font-bold">DevMind</h3>
                    <p class="text-xs text-gray-400">Your AI Coding Buddy</p>
                </div>
            </div>
            <div class="h-64 overflow-y-auto mb-4 bg-gray-900 rounded p-2" id="chat-messages"></div>
            <input type="text" class="w-full bg-gray-700 rounded px-3 py-2" placeholder="Ask me anything...">
        </div>

        <!-- Main Content -->
        <nav class="bg-gray-800 p-4">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-pink-500 bg-clip-text text-transparent">DevMind AI</h1>
                <div class="flex items-center space-x-4">
                    <span class="text-sm">🏆 Level 5</span>
                    <div class="bg-gray-700 rounded-full h-2 w-32">
                        <div class="bg-purple-500 h-2 rounded-full" style="width: 45%"></div>
                    </div>
                    <span class="text-sm">⭐ 230 Points</span>
                </div>
            </div>
        </nav>

        <main class="container mx-auto p-4">
            <!-- Code Analysis Section -->
            <div class="grid md:grid-cols-2 gap-6">
                <div class="bg-gray-800 rounded-lg p-6 transform hover:scale-105 transition-transform">
                    <h2 class="text-xl font-bold mb-4">🚀 Code Analysis</h2>
                    <div class="relative">
                        <textarea class="w-full h-48 bg-gray-900 rounded p-3 font-mono text-sm" placeholder="Paste your code here..."></textarea>
                        <div class="absolute top-2 right-2">
                            <span class="bg-purple-500 text-xs px-2 py-1 rounded">Smart Analysis™</span>
                        </div>
                    </div>
                    <button class="mt-4 bg-purple-500 hover:bg-purple-600 px-6 py-2 rounded-full font-bold transition-colors">Analyze</button>
                </div>

                <!-- Social Feed -->
                <div class="bg-gray-800 rounded-lg p-6">
                    <h2 class="text-xl font-bold mb-4">👥 Community Highlights</h2>
                    <div class="space-y-4">
                        <div class="bg-gray-900 rounded p-4">
                            <div class="flex items-center mb-2">
                                <img src="https://api.dicebear.com/6.x/personas/svg?seed=Alex" class="w-8 h-8 rounded-full mr-2">
                                <div>
                                    <p class="font-bold">Alex_Dev</p>
                                    <p class="text-xs text-gray-400">Improved code quality by 85% 🎉</p>
                                </div>
                            </div>
                            <div class="flex justify-between text-sm mt-2">
                                <button class="text-purple-400 hover:text-purple-300">👏 Applaud (23)</button>
                                <button class="text-gray-400 hover:text-gray-300">💬 Comment</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Achievements Section -->
            <div class="mt-8 bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-bold mb-4">🏆 Recent Achievements</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div class="bg-gray-900 rounded-lg p-4 text-center">
                        <div class="text-3xl mb-2">🎯</div>
                        <h3 class="font-bold">Code Master</h3>
                        <p class="text-xs text-gray-400">Analyzed 100 code snippets</p>
                    </div>
                    <div class="bg-gray-900 rounded-lg p-4 text-center opacity-50">
                        <div class="text-3xl mb-2">⚡</div>
                        <h3 class="font-bold">Speed Demon</h3>
                        <p class="text-xs text-gray-400">Complete analysis in 5 seconds</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Add interactive features
        document.querySelector('.cursor-pointer').addEventListener('click', () => {
            document.getElementById('ai-chat').classList.toggle('hidden');
        });

        // Simulate chat messages
        const messages = document.getElementById('chat-messages');
        setTimeout(() => {
            messages.innerHTML += '<div class="mb-2"><strong class="text-purple-400">DevMind:</strong> Hey there! Need help with your code? I'm here to assist! 😊</div>';
        }, 1000);
    </script>
</body>
</html>
