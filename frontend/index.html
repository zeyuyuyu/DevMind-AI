<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevMind AI - Code Analysis Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #4f46e5;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px var(--primary);
            }
            to {
                text-shadow: 0 0 20px var(--secondary);
            }
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--surface);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .dropzone {
            border: 2px dashed var(--primary);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dropzone:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        .metrics {
            margin-top: 2rem;
        }

        .metric {
            margin: 1rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
        }

        .progress-bar {
            height: 8px;
            background: var(--surface);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .progress {
            height: 100%;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            width: 0;
            transition: width 1s ease;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: var(--secondary);
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DevMind AI</h1>
            <p>Intelligent Code Analysis Dashboard</p>
        </header>

        <div class="dashboard">
            <div class="card">
                <h2>Code Analysis</h2>
                <div class="dropzone" id="dropzone">
                    <p>Drag and drop your code files here</p>
                    <p>or</p>
                    <button onclick="document.getElementById('fileInput').click()">Browse Files</button>
                    <input type="file" id="fileInput" hidden multiple>
                </div>
            </div>

            <div class="card">
                <h2>Quality Metrics</h2>
                <div class="metrics">
                    <div class="metric">
                        <label>Code Complexity</label>
                        <div class="progress-bar">
                            <div class="progress" id="complexityProgress"></div>
                        </div>
                    </div>
                    <div class="metric">
                        <label>Maintainability</label>
                        <div class="progress-bar">
                            <div class="progress" id="maintainabilityProgress"></div>
                        </div>
                    </div>
                    <div class="metric">
                        <label>Test Coverage</label>
                        <div class="progress-bar">
                            <div class="progress" id="coverageProgress"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dropzone functionality
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropzone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropzone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropzone.classList.add('border-primary');
        }

        function unhighlight(e) {
            dropzone.classList.remove('border-primary');
        }

        dropzone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        fileInput.addEventListener('change', function(e) {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            // Simulate analysis with random progress
            animateProgress('complexityProgress', Math.random() * 100);
            animateProgress('maintainabilityProgress', Math.random() * 100);
            animateProgress('coverageProgress', Math.random() * 100);
        }

        function animateProgress(id, value) {
            const progress = document.getElementById(id);
            progress.style.width = value + '%';
        }
    </script>
</body>
</html>
